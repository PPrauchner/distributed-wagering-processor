services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrations num serviço de execução única: com várias instâncias do app, elas
  # rodam uma vez só, antes de qualquer instância subir.
  migrate:
    build: .
    image: distributed-wagering-processor:local
    command: ["bun", "src/database/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: distributed-wagering-processor:local
    environment:
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  localstack:
    # 4.14.0 é a última versão que roda sem conta/token (ver CLAUDE.md).
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40
